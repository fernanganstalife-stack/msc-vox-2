
name: Build MSC VOXITY VST3

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Download repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 7.0.12
          path: JUCE

      - name: Configure CMake
        run: >
          cmake -S . -B build -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DJUCE_DIR="${{ github.workspace }}/JUCE"

      - name: Compile VST3
        run: cmake --build build --config Release --parallel

      - name: Find and package VST3
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Filter "*.vst3" -Directory -Recurse | Select-Object -First 1

          if (-not $plugin) {
            throw "No se encontro el archivo VST3."
          }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $plugin.FullName dist -Recurse

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: MSC-VOXITY-VST3
          path: dist/
